name: Weekly scan

on:
  schedule:
    - cron: "0 9 * * 0"   # Sundays 09:00 UTC = 4 AM Eastern (5 AM in summer)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated venue ids to scan (blank = all)"
        required: false
      force:
        description: "Re-read every page even if unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_MODELS: /home/runner/.ollama/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages and browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Cache the AI model
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "$OLLAMA_MODEL"

      - name: Scan venues
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m scanner.run $ARGS

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "nyc-art-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Weekly scan $(date -u +%Y-%m-%d)"
          git push
