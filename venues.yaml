# rarely change (address, subway, admission) so the AI model only has to read
# show titles and dates.
#
# To add a venue, copy a block and fill it in. `type` is one of:
# Museum, Gallery, Nonprofit, Auction house, Art fair, Public art
# `area` is one of: Manhattan, Long Island City, Brooklyn

